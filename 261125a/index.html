
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郵便番号検索</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 自分で作るCSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">

                <h1 class="text-center mb-3">会員登録　住所検索</h1>
                <p class="text-secondary text-center mb-4">
                    郵便番号を入力すると住所を自動で検索できます。
                </p>

                <!-- 郵便番号入力 -->
                <div class="mb-4">
                    <label for="zipcode" class="form-label">
                        郵便番号
                    </label>

                    <div class="input-group">
                        <input
                            type="text"
                            id="zipcode"
                            class="form-control"
                            placeholder="例：100-0001"
                            maxlength="8"
                        >

                        <button
                            type="button"
                            id="searchButton"
                            class="btn btn-primary"
                        >
                            住所検索
                        </button>
                    </div>
                </div>

                <!-- メッセージ表示 -->
                <div
                    id="message"
                    class="mb-4"
                    role="status"
                    aria-live="polite"
                ></div>

                <hr>

                <h2 class="h5 mb-3">住所</h2>

                <!-- 都道府県 -->
                <div class="mb-3">
                    <label for="prefecture" class="form-label">
                        都道府県
                    </label>
                    <input
                        type="text"
                        id="prefecture"
                        class="form-control"
                        placeholder="都道府県"
                    >
                </div>

                <!-- 市区町村 -->
                <div class="mb-3">
                    <label for="city" class="form-label">
                        市区町村
                    </label>
                    <input
                        type="text"
                        id="city"
                        class="form-control"
                        placeholder="市区町村"
                    >
                </div>

                <!-- 町域 -->
                <div class="mb-3">
                    <label for="town" class="form-label">
                        町域
                    </label>
                    <input
                        type="text"
                        id="town"
                        class="form-control"
                        placeholder="町域"
                    >
                </div>

                <!-- 番地 -->
                <div class="mb-3">
                    <label for="address" class="form-label">
                        番地
                    </label>
                    <input
                        type="text"
                        id="address"
                        class="form-control"
                        placeholder="番地を入力してください"
                    >
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 自分で作るJavaScript -->
    <script src="main.js"></script>

</body>
</html>
