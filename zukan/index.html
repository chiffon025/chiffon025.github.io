<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Document</title>
    <style>
        .active {background: #595959; color: white; }
        .favorited {background: none; border: none; cursor: pointer; color: red;}
        .favorite-button {background: none; border: none; cursor: pointer;}
    </style>
</head>
<body>
    <div class="container py-3">
    <p class="h1">キャラ図鑑</p>
    <p>12体中 <span id="displayCount">12</span>体を表示</p>
    <button class="type-tab">すべて</button>
    <button class="type-tab">炎</button>
    <button class="type-tab">水</button>
    <button class="type-tab">草</button>
    <button class="type-tab">おきにいり</button>
    <br>
    <input  id="searchInput" placeholder="名前で検索">
    <select id ="sortSelect">
        <option value="default">登録順</option>
        <option value="attackHigh">攻撃力が高い順</option>
        <option value="attackLow">攻撃力が低い順</option>
    </select>
    <ul class="row g-3 cols-4 list-unstyled"  id="characterList"></ul>
    <script src="https://morimorihoge.github.io/teu2026f/characters.js"></script>
    <script src="main.js"></script>
    </div>
</body>
</html>
